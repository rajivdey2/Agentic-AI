services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: simworld
      POSTGRES_PASSWORD: simworld
      POSTGRES_DB: simworld
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simworld"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://simworld:simworld@db:5432/simworld
      SIM_DAY_SECONDS: "60"
      FRONTEND_ORIGIN: "http://localhost:5173"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.web
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata: